[phases.setup]
nixPkgs = ["nodejs_22"]
cmds = ["corepack enable && corepack prepare pnpm@10.26.1 --activate"]

[phases.install]
cmds = ["pnpm install --ignore-scripts"]

[phases.build]
cmds = [
  "BASE_PATH=/ PORT=3000 NODE_ENV=production pnpm --filter @workspace/fapex-website run build",
  "NODE_ENV=production pnpm --filter @workspace/api-server run build"
]

[start]
cmd = "node --enable-source-maps artifacts/api-server/dist/index.mjs"
