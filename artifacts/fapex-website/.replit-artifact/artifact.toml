kind = "web"
previewPath = "/"
title = "Fapex Website"
version = "1.0.0"
id = "artifacts/fapex-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23448

[services.development]
run = "pnpm --filter @workspace/fapex-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fapex-website", "run", "build" ]
publicDir = "artifacts/fapex-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23448"
BASE_PATH = "/"
